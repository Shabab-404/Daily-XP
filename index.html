<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>daily xp grind tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    /* strict global lowercase */
    *, *::before, *::after, button, input, textarea, select {
      text-transform: lowercase !important;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'JetBrains Mono', monospace;
    }

    :root {
      --bg: #070908;
      --card-bg: rgba(14, 20, 17, 0.85);
      --card-border: rgba(0, 255, 136, 0.2);
      --primary: #00ff88;
      --primary-glow: rgba(0, 255, 136, 0.4);
      --primary-dim: rgba(0, 255, 136, 0.1);
      --text: #e2fced;
      --text-muted: #6e8a7c;
      --accent-warn: #ef4444;
      --accent-gold: #f59e0b;
      --font-scale: 1;
    }

    /* theme palettes */
    body.theme-cyan {
      --bg: #06090e;
      --card-bg: rgba(11, 19, 29, 0.85);
      --card-border: rgba(0, 240, 255, 0.25);
      --primary: #00f0ff;
      --primary-glow: rgba(0, 240, 255, 0.4);
      --primary-dim: rgba(0, 240, 255, 0.1);
      --text: #e0faff;
      --text-muted: #5e7a88;
    }

    body.theme-amber {
      --bg: #0a0805;
      --card-bg: rgba(22, 17, 12, 0.85);
      --card-border: rgba(245, 158, 11, 0.25);
      --primary: #f59e0b;
      --primary-glow: rgba(245, 158, 11, 0.4);
      --primary-dim: rgba(245, 158, 11, 0.1);
      --text: #fef3c7;
      --text-muted: #8b7355;
    }

    body.theme-magenta {
      --bg: #090508;
      --card-bg: rgba(22, 12, 20, 0.85);
      --card-border: rgba(255, 0, 128, 0.25);
      --primary: #ff0080;
      --primary-glow: rgba(255, 0, 128, 0.4);
      --primary-dim: rgba(255, 0, 128, 0.1);
      --text: #ffe4f3;
      --text-muted: #8c5d79;
    }

    body.theme-obsidian {
      --bg: #0a0a0a;
      --card-bg: rgba(18, 18, 18, 0.9);
      --card-border: rgba(255, 255, 255, 0.18);
      --primary: #e5e5e5;
      --primary-glow: rgba(255, 255, 255, 0.3);
      --primary-dim: rgba(255, 255, 255, 0.08);
      --text: #f5f5f5;
      --text-muted: #737373;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 3rem;
      background-image: 
        radial-gradient(circle at 50% 0%, var(--primary-dim) 0%, transparent 60%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 32px 32px, 32px 32px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .app-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* common card style */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      transition: border-color 0.3s ease;
    }

    /* section 1: controls & personalization */
    .controls-grid {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px dashed var(--card-border);
      font-size: 0.8rem;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .control-label {
      color: var(--text-muted);
      font-size: 0.75rem;
      letter-spacing: 0.5px;
    }

    .pill-btn {
      background: var(--primary-dim);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .pill-btn:hover {
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.08);
    }

    .pill-btn.active {
      border-color: var(--primary);
      background: var(--primary);
      color: #000;
      font-weight: 700;
      box-shadow: 0 0 10px var(--primary-glow);
    }

    .pill-btn.danger {
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.1);
    }

    .pill-btn.danger:hover {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.25);
    }

    /* avatar chooser */
    .avatar-selector {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .avatar-btn {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      border: 2px solid var(--card-border);
      background: #0d1310;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      padding: 3px;
    }

    .avatar-btn svg {
      width: 100%;
      height: 100%;
    }

    .avatar-btn:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .avatar-btn.selected {
      border-color: var(--primary);
      box-shadow: 0 0 12px var(--primary-glow);
      background: var(--primary-dim);
    }

    /* section 2: character status hud */
    .status-hud {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      flex-wrap: wrap;
    }

    .current-avatar-preview {
      width: 70px;
      height: 70px;
      border-radius: 12px;
      border: 2px solid var(--primary);
      box-shadow: 0 0 16px var(--primary-glow);
      background: #000;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .current-avatar-preview svg {
      width: 100%;
      height: 100%;
    }

    .hud-main {
      flex: 1;
      min-width: 250px;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .hud-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .level-badge {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--primary);
      text-shadow: 0 0 8px var(--primary-glow);
    }

    .rank-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      border-left: 2px solid var(--card-border);
      padding-left: 0.5rem;
      margin-left: 0.5rem;
    }

    .xp-counter-text {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .xp-counter-text span {
      color: var(--text);
      font-weight: 700;
    }

    /* progress bar */
    .bar-track {
      width: 100%;
      height: 14px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 7px;
      overflow: hidden;
      position: relative;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #ffffff);
      width: 0%;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 10px var(--primary);
    }

    .hud-footer-metrics {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .metric-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background: rgba(0, 0, 0, 0.4);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      border: 1px solid var(--card-border);
    }

    .metric-pill strong {
      color: var(--primary);
    }

    /* section 3: quest entry console */
    .entry-card {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
    }

    .task-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .task-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px var(--primary-glow);
    }

    .task-input::placeholder {
      color: var(--text-muted);
      opacity: 0.6;
    }

    .submit-btn {
      background: var(--primary);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 0 1.4rem;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 12px var(--primary-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .submit-btn:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }

    .submit-btn:active {
      transform: translateY(1px);
    }

    /* tier buttons & tags */
    .options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .tags-container {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .tag-chip {
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      padding: 0.2rem 0.5rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tag-chip:hover, .tag-chip.active {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-dim);
    }

    .custom-xp-input {
      width: 70px;
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 0.25rem 0.4rem;
      color: var(--text);
      font-size: 0.75rem;
      text-align: center;
      outline: none;
    }

    .custom-xp-input:focus {
      border-color: var(--primary);
    }

    /* section 4: log book & history */
    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 0.75rem;
    }

    .log-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .log-search {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 0.3rem 0.6rem;
      font-size: 0.75rem;
      color: var(--text);
      outline: none;
      width: 160px;
    }

    .log-search:focus {
      border-color: var(--primary);
    }

    .log-filters {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
    }

    .log-feed {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .log-feed::-webkit-scrollbar {
      width: 5px;
    }

    .log-feed::-webkit-scrollbar-thumb {
      background: var(--card-border);
      border-radius: 3px;
    }

    .log-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      font-size: 0.85rem;
      animation: fadeIn 0.25s ease-out;
      transition: border-color 0.15s ease;
    }

    .log-item:hover {
      border-color: var(--card-border);
    }

    .log-item.penalty {
      border-color: rgba(239, 68, 68, 0.4);
      background: rgba(239, 68, 68, 0.05);
    }

    .log-item-left {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      overflow: hidden;
    }

    .log-time {
      font-size: 0.7rem;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .log-text {
      color: var(--text);
      word-break: break-word;
    }

    .log-item-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .log-xp-badge {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-dim);
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      border: 1px solid var(--primary-glow);
    }

    .log-item.penalty .log-xp-badge {
      color: #f87171;
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.4);
    }

    .delete-item-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 2px 4px;
      transition: color 0.15s;
    }

    .delete-item-btn:hover {
      color: #ef4444;
    }

    .empty-state {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      border: 1px dashed var(--card-border);
      border-radius: 8px;
    }

    /* floating xp toast */
    .floating-xp {
      position: fixed;
      pointer-events: none;
      font-weight: 800;
      font-size: 1.3rem;
      color: var(--primary);
      text-shadow: 0 0 10px var(--primary-glow);
      animation: floatUp 1.2s forwards cubic-bezier(0.1, 0.9, 0.2, 1);
      z-index: 1000;
    }

    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(0) scale(0.7); }
      20% { opacity: 1; transform: translateY(-15px) scale(1.1); }
      80% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-50px) scale(1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .input-row {
        flex-direction: column;
      }
      .submit-btn {
        padding: 0.75rem;
      }
      .options-row {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body class="theme-lime">

  <div class="app-container">
    
    <!-- CARD 1: CONTROLS, THEMES, AVATARS (ALL IN ONE PLACE) -->
    <div class="card" style="display: flex; flex-direction: column; gap: 0.8rem;">
      <!-- Row 1: Themes & Toggles -->
      <div class="controls-grid">
        <div class="control-group">
          <span class="control-label">palette:</span>
          <button class="pill-btn active" data-theme="theme-lime" onclick="setPalette('theme-lime')">lime</button>
          <button class="pill-btn" data-theme="theme-cyan" onclick="setPalette('theme-cyan')">cyan</button>
          <button class="pill-btn" data-theme="theme-amber" onclick="setPalette('theme-amber')">amber</button>
          <button class="pill-btn" data-theme="theme-magenta" onclick="setPalette('theme-magenta')">magenta</button>
          <button class="pill-btn" data-theme="theme-obsidian" onclick="setPalette('theme-obsidian')">obsidian</button>
        </div>

        <div class="control-group">
          <button class="pill-btn" id="soundBtn" onclick="toggleSound()">🔊 sound: on</button>
          <button class="pill-btn danger" onclick="simulateMissedDay()">⚠️ test missed day penalty</button>
          <button class="pill-btn danger" onclick="resetAllProgress()">↺ reset all</button>
        </div>
      </div>

      <!-- Row 2: Built-in Avatar Operative Chooser (No upload needed) -->
      <div class="controls-grid" style="border-bottom: none; padding-bottom: 0;">
        <div class="avatar-selector">
          <span class="control-label">operative avatar:</span>
          
          <!-- Avatar 1: Shadow Coder -->
          <button class="avatar-btn selected" data-avatar="coder" onclick="selectAvatar('coder')" title="shadow coder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 18l6-6-6-6M8 6l-6 6 6 6"></path>
            </svg>
          </button>

          <!-- Avatar 2: Neon Rogue -->
          <button class="avatar-btn" data-avatar="rogue" onclick="selectAvatar('rogue')" title="cyber rogue">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2l3 5h6l-5 4 2 6-6-4-6 4 2-6-5-4h6z"></path>
            </svg>
          </button>

          <!-- Avatar 3: Core Sentinel -->
          <button class="avatar-btn" data-avatar="sentinel" onclick="selectAvatar('sentinel')" title="core sentinel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
          </button>

          <!-- Avatar 4: Cyber Ronin -->
          <button class="avatar-btn" data-avatar="ronin" onclick="selectAvatar('ronin')" title="cyber ronin">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
          </button>

          <!-- Avatar 5: Pixel Monarch -->
          <button class="avatar-btn" data-avatar="monarch" onclick="selectAvatar('monarch')" title="pixel monarch">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 16V9l4 3 3-5 3 5 4-3v7z"></path>
              <path d="M3 18h18v2H3z"></path>
            </svg>
          </button>
        </div>

        <span class="control-label" id="operativeName">operative: shadow coder</span>
      </div>
    </div>

    <!-- CARD 2: REAL CHARACTER STATUS HUD -->
    <div class="card status-hud">
      <div class="current-avatar-preview" id="currentAvatarSlot">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 18l6-6-6-6M8 6l-6 6 6 6"></path>
        </svg>
      </div>

      <div class="hud-main">
        <div class="hud-header">
          <div style="display: flex; align-items: baseline;">
            <div class="level-badge" id="lvlDisplay">lvl 1</div>
            <div class="rank-title" id="rankDisplay">novice grind initiate</div>
          </div>
          <div class="xp-counter-text">
            <span id="currentXpText">0</span> / <span id="targetXpText">100</span> xp
          </div>
        </div>

        <!-- xp progress bar -->
        <div class="bar-track">
          <div class="bar-fill" id="xpBarFill"></div>
        </div>

        <div class="hud-footer-metrics">
          <div class="metric-pill">
            🔥 streak: <strong id="streakDisplay">0 days</strong>
          </div>
          <div class="metric-pill">
            ⚡ today: <strong id="todayXpDisplay">0 / 500 xp</strong>
          </div>
          <div class="metric-pill">
            🏆 total earned: <strong id="totalXpDisplay">0 xp</strong>
          </div>
        </div>
      </div>
    </div>

    <!-- CARD 3: QUEST LOG ENTRY (ACTION HUB) -->
    <div class="card entry-card">
      <div class="input-row">
        <input 
          type="text" 
          id="taskInput" 
          class="task-input" 
          placeholder="what did you complete? (e.g. finished math hw, 1hr coding...)" 
          autocomplete="off"
          onkeydown="if(event.key === 'Enter') submitTask()"
        >
        <button class="submit-btn" onclick="submitTask()">
          <span>log quest</span> ↵
        </button>
      </div>

      <!-- quick tiers & quick tags in direct sight -->
      <div class="options-row">
        <div class="control-group">
          <span class="control-label">xp tier:</span>
          <button class="pill-btn active tier-pill" data-xp="15" onclick="selectTier(15, this)">quick (+15)</button>
          <button class="pill-btn tier-pill" data-xp="35" onclick="selectTier(35, this)">standard (+35)</button>
          <button class="pill-btn tier-pill" data-xp="60" onclick="selectTier(60, this)">hard (+60)</button>
          <button class="pill-btn tier-pill" data-xp="100" onclick="selectTier(100, this)">epic (+100)</button>
          <input type="number" id="customXp" class="custom-xp-input" placeholder="custom" min="1" max="250" oninput="onCustomXpInput(this)">
        </div>

        <div class="tags-container">
          <span class="control-label">tag:</span>
          <span class="tag-chip" onclick="appendTag('#lesson')">#lesson</span>
          <span class="tag-chip" onclick="appendTag('#hw')">#hw</span>
          <span class="tag-chip" onclick="appendTag('#study')">#study</span>
          <span class="tag-chip" onclick="appendTag('#code')">#code</span>
          <span class="tag-chip" onclick="appendTag('#workout')">#workout</span>
        </div>
      </div>
    </div>

    <!-- CARD 4: THE LOG BOOK -->
    <div class="card">
      <div class="log-header">
        <div class="log-title">
          <span>📖 grind log book</span>
          <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: 400;" id="logCountText">(0 entries)</span>
        </div>

        <div style="display: flex; gap: 0.5rem; align-items: center;">
          <input type="text" id="searchLog" class="log-search" placeholder="search entries..." oninput="renderLog()">
          <button class="pill-btn" onclick="copyLogToClipboard()">📋 copy</button>
        </div>
      </div>

      <div class="log-filters">
        <button class="pill-btn active log-filter-btn" data-filter="all" onclick="setLogFilter('all', this)">all</button>
        <button class="pill-btn log-filter-btn" data-filter="today" onclick="setLogFilter('today', this)">today</button>
        <button class="pill-btn log-filter-btn" data-filter="penalties" onclick="setLogFilter('penalties', this)">penalties</button>
        <button class="pill-btn log-filter-btn" data-filter="high" onclick="setLogFilter('high', this)">high xp (60+)</button>
      </div>

      <div class="log-feed" id="logFeed">
        <!-- populated dynamically -->
      </div>
    </div>

  </div>

  <script>
    /* -------------------------------------------------------------
       STATE MANAGEMENT & INITIALIZATION (CLEAN NO RANDOM PROGRESS)
    -------------------------------------------------------------- */
    const DAILY_CAP = 500;
    const MAX_LEVEL = 100;

    // clean fresh default state
    let state = {
      level: 1,
      currentXp: 0,
      totalXpEarned: 0,
      todayXp: 0,
      lastActiveDate: null,
      streak: 0,
      selectedTierXp: 15,
      activePalette: 'theme-lime',
      activeAvatar: 'coder',
      soundEnabled: true,
      tasks: [] // starts completely empty: no dummy or random data
    };

    let activeFilter = 'all';

    // SVG icon library for avatars
    const AVATAR_SVGS = {
      coder: `<svg viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"></path></svg>`,
      rogue: `<svg viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 5h6l-5 4 2 6-6-4-6 4 2-6-5-4h6z"></path></svg>`,
      sentinel: `<svg viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`,
      ronin: `<svg viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>`,
      monarch: `<svg viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16V9l4 3 3-5 3 5 4-3v7z"></path><path d="M3 18h18v2H3z"></path></svg>`
    };

    const AVATAR_NAMES = {
      coder: "shadow coder",
      rogue: "cyber rogue",
      sentinel: "core sentinel",
      ronin: "cyber ronin",
      monarch: "pixel monarch"
    };

    // Calculate required XP for a given level
    function xpRequiredForLevel(lvl) {
      if (lvl >= MAX_LEVEL) return 999999;
      return Math.floor(100 * Math.pow(lvl, 1.25));
    }

    // Rank titles
    function getRankTitle(lvl) {
      if (lvl >= 80) return "monarch of eternity";
      if (lvl >= 60) return "s-rank supreme";
      if (lvl >= 40) return "a-rank elite operative";
      if (lvl >= 25) return "b-rank specialist";
      if (lvl >= 15) return "c-rank grinder";
      if (lvl >= 5)  return "d-rank apprentice";
      return "novice grind initiate";
    }

    /* -------------------------------------------------------------
       AUDIO SYNTHESIZER (NO EXTERNAL AUDIO FILES)
    -------------------------------------------------------------- */
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    function playSound(type) {
      if (!state.soundEnabled) return;
      try {
        const ctx = getAudioContext();
        if (ctx.state === 'suspended') ctx.resume();

        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'task') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'levelup') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.1);
          osc.frequency.setValueAtTime(783.99, now + 0.2);
          osc.frequency.setValueAtTime(1046.50, now + 0.3);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
          osc.start(now);
          osc.stop(now + 0.5);
        } else if (type === 'penalty') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(110, now + 0.25);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        }
      } catch (e) {
        console.warn("audio error", e);
      }
    }

    function toggleSound() {
      state.soundEnabled = !state.soundEnabled;
      document.getElementById('soundBtn').textContent = state.soundEnabled ? '🔊 sound: on' : '🔇 sound: off';
      saveState();
    }

    /* -------------------------------------------------------------
       DATE & STREAK AUDIT
    -------------------------------------------------------------- */
    function getTodayString() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function auditStreakAndDay() {
      const today = getTodayString();
      if (!state.lastActiveDate) {
        // brand new user: streak starts at 0, no penalties
        return;
      }

      if (state.lastActiveDate === today) {
        // same day, nothing to reset
        return;
      }

      const lastDate = new Date(state.lastActiveDate);
      const currDate = new Date(today);
      const diffDays = Math.floor((currDate - lastDate) / (1000 * 60 * 60 * 24));

      // Reset daily earned XP on a new calendar day
      state.todayXp = 0;

      if (diffDays === 1) {
        // yesterday was active, streak holds
      } else if (diffDays > 1) {
        // missed one or more days! Apply penalty
        const penaltyXp = 50;
        state.streak = 0;
        applyPenaltyXP(penaltyXp, `missed ${diffDays - 1} day(s) streak break`);
      }
    }

    function applyPenaltyXP(amount, reason) {
      state.currentXp -= amount;
      if (state.currentXp < 0) {
        if (state.level > 1) {
          state.level -= 1;
          const req = xpRequiredForLevel(state.level);
          state.currentXp = Math.max(0, req + state.currentXp);
        } else {
          state.currentXp = 0;
        }
      }

      // Log penalty as an entry
      state.tasks.unshift({
        id: 'penalty-' + Date.now(),
        text: `penalty: ${reason.toLowerCase()}`,
        xp: -amount,
        isPenalty: true,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }).toLowerCase(),
        date: getTodayString()
      });

      playSound('penalty');
      saveState();
      renderUI();
    }

    function simulateMissedDay() {
      state.streak = 0;
      applyPenaltyXP(50, "manual simulated missed day");
      spawnFloatingToast("-50 xp penalty!", "#ef4444");
    }

    /* -------------------------------------------------------------
       XP PROGRESSION & LEVEL LOGIC
    -------------------------------------------------------------- */
    function addXP(amount, taskName) {
      if (state.level >= MAX_LEVEL) {
        alert("maximum level 100 reached! you are at cap.");
        return;
      }

      // check daily cap
      const remainingToday = DAILY_CAP - state.todayXp;
      if (remainingToday <= 0) {
        alert("daily cap of 500 xp reached! rest up for tomorrow to prevent burnout.");
        return;
      }

      const actualGain = Math.min(amount, remainingToday);
      const today = getTodayString();

      // update streak if first activity today
      if (state.lastActiveDate !== today) {
        state.streak += 1;
        state.lastActiveDate = today;
      }

      state.currentXp += actualGain;
      state.todayXp += actualGain;
      state.totalXpEarned += actualGain;

      let targetXp = xpRequiredForLevel(state.level);
      let didLevelUp = false;

      while (state.currentXp >= targetXp && state.level < MAX_LEVEL) {
        state.currentXp -= targetXp;
        state.level += 1;
        targetXp = xpRequiredForLevel(state.level);
        didLevelUp = true;
      }

      // log entry
      state.tasks.unshift({
        id: 'task-' + Date.now(),
        text: taskName.toLowerCase(),
        xp: actualGain,
        isPenalty: false,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }).toLowerCase(),
        date: today
      });

      if (didLevelUp) {
        playSound('levelup');
        spawnFloatingToast(`level up! reached lvl ${state.level}`, "var(--primary)");
      } else {
        playSound('task');
        spawnFloatingToast(`+${actualGain} xp`, "var(--primary)");
      }

      saveState();
      renderUI();
    }

    /* -------------------------------------------------------------
       USER INTERACTIONS
    -------------------------------------------------------------- */
    function selectTier(xp, btnElement) {
      state.selectedTierXp = xp;
      document.querySelectorAll('.tier-pill').forEach(b => b.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');
      document.getElementById('customXp').value = '';
    }

    function onCustomXpInput(input) {
      const val = parseInt(input.value, 10);
      if (!isNaN(val) && val > 0) {
        state.selectedTierXp = Math.min(250, val);
        document.querySelectorAll('.tier-pill').forEach(b => b.classList.remove('active'));
      }
    }

    function appendTag(tag) {
      const input = document.getElementById('taskInput');
      const cur = input.value.trim();
      if (!cur.includes(tag)) {
        input.value = cur ? `${cur} ${tag}` : tag;
      }
      input.focus();
    }

    function submitTask() {
      const input = document.getElementById('taskInput');
      const val = input.value.trim().toLowerCase();
      if (!val) return;

      const xp = state.selectedTierXp || 15;
      addXP(xp, val);

      input.value = '';
      input.focus();
    }

    function deleteTask(id) {
      const idx = state.tasks.findIndex(t => t.id === id);
      if (idx !== -1) {
        state.tasks.splice(idx, 1);
        saveState();
        renderLog();
      }
    }

    function setPalette(themeClass) {
      document.body.className = themeClass;
      state.activePalette = themeClass;
      document.querySelectorAll('[data-theme]').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-theme') === themeClass);
      });
      saveState();
    }

    function selectAvatar(avatarKey) {
      state.activeAvatar = avatarKey;
      document.querySelectorAll('.avatar-btn').forEach(btn => {
        btn.classList.toggle('selected', btn.getAttribute('data-avatar') === avatarKey);
      });
      document.getElementById('currentAvatarSlot').innerHTML = AVATAR_SVGS[avatarKey];
      document.getElementById('operativeName').textContent = `operative: ${AVATAR_NAMES[avatarKey]}`;
      saveState();
    }

    function setLogFilter(filter, btn) {
      activeFilter = filter;
      document.querySelectorAll('.log-filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderLog();
    }

    function copyLogToClipboard() {
      if (state.tasks.length === 0) {
        alert("log book is empty right now.");
        return;
      }
      const lines = state.tasks.map(t => `[${t.timestamp}] ${t.text} (${t.xp >= 0 ? '+' : ''}${t.xp} xp)`);
      navigator.clipboard.writeText(lines.join('\n')).then(() => {
        alert("log copied to clipboard!");
      });
    }

    function resetAllProgress() {
      if (confirm("are you sure you want to completely reset all progress back to level 1 and wipe the log?")) {
        localStorage.removeItem('daily_xp_grind_clean_state');
        state = {
          level: 1,
          currentXp: 0,
          totalXpEarned: 0,
          todayXp: 0,
          lastActiveDate: null,
          streak: 0,
          selectedTierXp: 15,
          activePalette: 'theme-lime',
          activeAvatar: 'coder',
          soundEnabled: true,
          tasks: []
        };
        renderUI();
        alert("all progress reset.");
      }
    }

    function spawnFloatingToast(text, color) {
      const toast = document.createElement('div');
      toast.className = 'floating-xp';
      toast.style.left = '50%';
      toast.style.top = '40%';
      toast.style.color = color || 'var(--primary)';
      toast.textContent = text.toLowerCase();
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 1200);
    }

    /* -------------------------------------------------------------
       RENDERING
    -------------------------------------------------------------- */
    function renderUI() {
      // level & xp bar
      document.getElementById('lvlDisplay').textContent = `lvl ${state.level}`;
      document.getElementById('rankDisplay').textContent = getRankTitle(state.level);

      const targetXp = xpRequiredForLevel(state.level);
      document.getElementById('currentXpText').textContent = state.currentXp;
      document.getElementById('targetXpText').textContent = targetXp;

      const pct = Math.min(100, Math.max(0, (state.currentXp / targetXp) * 100));
      document.getElementById('xpBarFill').style.width = `${pct}%`;

      // metrics
      document.getElementById('streakDisplay').textContent = `${state.streak} ${state.streak === 1 ? 'day' : 'days'}`;
      document.getElementById('todayXpDisplay').textContent = `${state.todayXp} / ${DAILY_CAP} xp`;
      document.getElementById('totalXpDisplay').textContent = `${state.totalXpEarned} xp`;

      // avatars & theme
      setPalette(state.activePalette || 'theme-lime');
      selectAvatar(state.activeAvatar || 'coder');

      renderLog();
    }

    function renderLog() {
      const feed = document.getElementById('logFeed');
      const searchQuery = (document.getElementById('searchLog').value || '').toLowerCase().trim();
      const today = getTodayString();

      let filtered = state.tasks.filter(t => {
        if (searchQuery && !t.text.toLowerCase().includes(searchQuery)) return false;
        if (activeFilter === 'today') return t.date === today;
        if (activeFilter === 'penalties') return t.isPenalty;
        if (activeFilter === 'high') return t.xp >= 60;
        return true;
      });

      document.getElementById('logCountText').textContent = `(${state.tasks.length} entries)`;

      if (filtered.length === 0) {
        feed.innerHTML = `
          <div class="empty-state">
            ${state.tasks.length === 0 ? 'no quests completed yet. type a task above to earn your first xp!' : 'no tasks match this filter.'}
          </div>
        `;
        return;
      }

      feed.innerHTML = filtered.map(t => `
        <div class="log-item ${t.isPenalty ? 'penalty' : ''}">
          <div class="log-item-left">
            <span class="log-time">${t.timestamp}</span>
            <span class="log-text">${escapeHtml(t.text)}</span>
          </div>
          <div class="log-item-right">
            <span class="log-xp-badge">${t.xp >= 0 ? '+' : ''}${t.xp} xp</span>
            <button class="delete-item-btn" onclick="deleteTask('${t.id}')" title="delete entry">✕</button>
          </div>
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    /* -------------------------------------------------------------
       STORAGE PERSISTENCE
    -------------------------------------------------------------- */
    function saveState() {
      localStorage.setItem('daily_xp_grind_clean_state', JSON.stringify(state));
    }

    function loadState() {
      try {
        const raw = localStorage.getItem('daily_xp_grind_clean_state');
        if (raw) {
          const parsed = JSON.parse(raw);
          state = { ...state, ...parsed };
        }
      } catch (e) {
        console.warn("error loading state", e);
      }
    }

    // Initialize on page load
    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      auditStreakAndDay();
      renderUI();
    });
  </script>
</body>
</html>
